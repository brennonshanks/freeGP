[single_run]
dataset_root = "~/freeGP-datasets/membranes/katka"
mode = "nuts"
kernel = "stationary"
objective = "loo"
device = "cpu"
seed = 42

num_bins = 20
num_test_points = 100

# Primary sweep knobs.
warmup_steps = 1000
num_samples = 2000

# Convergence diagnostics are most useful with 4 chains.
num_chains = 4

# Predictive post-processing.
predictive_samples = 100
posterior_draws = 0
no_corner = false

results_dir = "/home/bshanks/freeGP-dev/results/hmc-calibration-stationary"
