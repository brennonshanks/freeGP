[single_run]
dataset_root = "/home/martin/projects/datasets/free-energy/ions/denis/NMSM_prosECCo75_MOD"
mode = "nuts"
kernel = "stationary"
objective = "loo"
device = "cpu"
seed = 42

num_bins = 20
num_test_points = 100

reference_wham_path = "/home/martin/projects/datasets/free-energy/ions/denis/NMSM_prosECCo75/reference-wham/denis-nmsm-wham.csv"
reference_wham_x_units = "angstrom"
# reference_ui_path omitted → UI reference skipped

# f_alignment = "min"   # zero at free energy minimum (barrier is positive)
pmf_alignment = "max" # zero at free energy maximum (default, barrier is negative)

# Primary sweep knobs.
warmup_steps = 1000
num_samples = 2000

# Convergence diagnostics are most useful with 4 chains.
num_chains = 4

# Predictive post-processing.
predictive_samples = 100
posterior_draws = 0
no_corner = false

results_dir = "/home/martin/projects/freeGP/results/NMSM_MOD-hmc-4chains-calibration"
