[ablation]
dataset_root = "~/freeGP-datasets/membranes/katka"
method = "nuts"
kernel = "stationary"
objective = "both"
include_fixed = true
include_optimized = true
checkpoint_cells = true
resume = true

window_counts = [3, 4, 6, 8, 10, 13, 16, 19, 22, 25]
trajectory_fractions = [0.04, 0.063, 0.1, 0.16, 0.25, 0.4, 0.6, 0.8, 0.9, 1.0]

window_selection_mode = "random_subset"
trajectory_selection_mode = "contiguous"
random_seed = 42

num_bins = 20
num_test_points = 100
warmup_steps = 500
num_samples = 1000
num_chains = 4
max_tree_depth = 10
predictive_samples = 100
barrier_bins = 30
opt_steps = 250
opt_restarts = 3
opt_learning_rate = 0.05

results_dir = "/home/bshanks/freeGP-dev/results/membrane-ablation-10x10-5replicates"
