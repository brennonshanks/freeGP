[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freegp-updated"
version = "0.1.0"
description = "Gaussian-process free-energy tools and notebooks for umbrella-sampling analysis"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "torch>=2.2",
  "matplotlib>=3.8",
  "tqdm>=4.66",
]

[project.scripts]
freegp-gprhd-hmc = "freegp.run_gprhd_hmc:main"

[project.optional-dependencies]
mcmc = [
  "emcee>=3.1.6",
  "corner>=2.2.2",
  "pyro-ppl>=1.9.1",
]
notebook = [
  "ipykernel>=6.29",
  "jupyterlab>=4.2",
]
ui_semen = [
  "toml>=0.10.2",
]
all = [
  "emcee>=3.1.6",
  "corner>=2.2.2",
  "pyro-ppl>=1.9.1",
  "ipykernel>=6.29",
  "jupyterlab>=4.2",
  "toml>=0.10.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["freegp*"]
