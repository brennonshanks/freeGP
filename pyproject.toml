[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freegp"
version = "0.2.0"
description = "Gaussian-process free-energy tools for umbrella-sampling and metadynamics analysis"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "torch>=2.2",
  "matplotlib>=3.8",
  "tqdm>=4.66",
  "pyro-ppl>=1.9.1",
  "corner>=2.2.2",
]

[project.scripts]
freegp-gprhd-hmc = "freegp.run_gprhd_hmc:main"
freegp-ablation-grid = "freegp.run_ablation_grid:main"

[project.optional-dependencies]
notebook = [
  "ipykernel>=6.29",
  "jupyterlab>=4.2",
]
ui_semen = [
  "toml>=0.10.2",
]
all = [
  "ipykernel>=6.29",
  "jupyterlab>=4.2",
  "toml>=0.10.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["freegp*"]
